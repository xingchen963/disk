name: DiskRescue checks

on:
  push:
    branches: [main]
    paths:
      - "DiskRescue/**"
      - ".github/workflows/diskrescue-checks.yml"
  pull_request:
    paths:
      - "DiskRescue/**"
      - ".github/workflows/diskrescue-checks.yml"

jobs:
  python-checks:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application dependencies
        working-directory: DiskRescue
        run: python -m pip install -r requirements.txt
      - name: Compile all project Python files
        run: python -m compileall -q DiskRescue
      - name: Verify application imports
        working-directory: DiskRescue
        run: python -c "from diskrescue.smartctl import Device, discover_devices, read_smart, summarize; from diskrescue.main_window import MainWindow; print('DiskRescue imports OK')"
      - name: Test partition and file-system signature parsers
        working-directory: DiskRescue
        run: python -m unittest discover -s tests -v
