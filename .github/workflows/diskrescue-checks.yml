name: DiskRescue checks

on:
  push:
    branches: [main]
    paths:
      - "DiskRescue/**"
      - ".github/workflows/diskrescue-checks.yml"
  pull_request:
    paths:
      - "DiskRescue/**"
      - ".github/workflows/diskrescue-checks.yml"

jobs:
  python-checks:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all project Python files
        run: python -m compileall -q DiskRescue
      - name: Test partition and file-system signature parsers
        working-directory: DiskRescue
        run: python -m unittest discover -s tests -v
